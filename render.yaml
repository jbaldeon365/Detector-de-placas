services:
  - type: web
    name: detector-placas
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --worker-tmp-dir /dev/shm -b 0.0.0.0:$PORT app:app
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
